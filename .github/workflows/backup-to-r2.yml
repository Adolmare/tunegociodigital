name: Backup Database to Cloudflare R2

on:
  schedule:
    # Todos los días a las 05:00 UTC (00:00 hora Colombia)
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client and boto3
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install "django-storages[boto3]==1.14.6"
      - name: Run PostgreSQL dump and upload to Cloudflare R2
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -z "$MIGRATOR_DATABASE_URL" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "Secrets MIGRATOR_DATABASE_URL y R2_* aún no configurados en GitHub; omitiendo backup."
            exit 0
          fi
          python scripts/backup_postgres.py
