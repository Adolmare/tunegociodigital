name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: tunegocio
          POSTGRES_USER: tn_owner
          POSTGRES_PASSWORD: owner_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tn_owner -d tunegocio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create restricted application role
        env:
          MIGRATOR_DATABASE_URL: postgresql://tn_owner:owner_pass@localhost:5432/tunegocio
          APP_DB_PASSWORD: app_pass
        run: python scripts/provision_app_role.py
      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-not-a-production-secret
          DATABASE_URL: postgresql://tn_app:app_pass@localhost:5432/tunegocio
          MIGRATOR_DATABASE_URL: postgresql://tn_owner:owner_pass@localhost:5432/tunegocio
          ALLOWED_HOSTS: ci.invalid
          CSRF_TRUSTED_ORIGINS: https://ci.invalid
          R2_ACCOUNT_ID: ci-only
          R2_ACCESS_KEY_ID: ci-only
          R2_SECRET_ACCESS_KEY: ci-only-not-a-secret
          R2_BUCKET_NAME: ci-only
        run: python manage.py check --deploy
      - name: Run test suite
        env:
          DATABASE_URL: postgresql://tn_app:app_pass@localhost:5432/tunegocio
          MIGRATOR_DATABASE_URL: postgresql://tn_owner:owner_pass@localhost:5432/tunegocio
        run: python -m pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tunegocio:ci
