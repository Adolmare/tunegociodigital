services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: tunegocio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: {}