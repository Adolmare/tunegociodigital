services:
  - type: web
    name: tunegocio-api
    runtime: docker
    plan: starter
    healthCheckPath: /health/
    preDeployCommand: >-
      python scripts/provision_app_role.py &&
      python manage.py migrate --database=migrator --noinput
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MIGRATOR_DATABASE_URL
        sync: false
      - key: APP_DB_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: WEB_CONCURRENCY
        value: "2"
